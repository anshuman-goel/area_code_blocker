name: Android CI

on:
  push:
    branches: [ "main", "privacy-policy" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests & Verify Screenshots
      run: ./gradlew verifyRoborazziDebug

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/build/reports/tests/
          **/build/reports/lint-results-debug.xml

  instrumentation-tests:
    name: Run Instrumentation Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM access
      run: |
        sudo apt-get update
        sudo apt-get install -y cpu-checker
        kvm-ok || true
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
          echo "KVM is available and permissions are set."
        else
          echo "KVM device not found. Attempting to load module..."
          sudo modprobe kvm-intel || sudo modprobe kvm-amd || sudo modprobe kvm || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM loaded successfully."
          else
            echo "KVM still not found. Tests may run slowly or fail."
          fi
        fi

    - name: Run Instrumentation Tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        script: ./gradlew connectedDebugAndroidTest
